[package]
name = "omnidl-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OmniDL desktop & mobile app (Tauri 2): Windows, macOS, Linux, Android, iOS from one codebase."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
omnidl-core = { path = "../../../crates/omnidl-core" }
omnidl-engine = { path = "../../../crates/omnidl-engine" }

[profile.release]
lto = true
codegen-units = 1
