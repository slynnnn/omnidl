[workspace]
resolver = "2"
members = ["crates/omnidl-core", "crates/omnidl-engine", "crates/omnidl-cli"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/slynnnn/omnidl"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
